# =====================================================================
#  CRAFTS reprocessing - master config
#  Step 0 (audit) reads [paths] and [audit].
#  Later steps (update pointing, fits_to_fil, rfifind, birdies, search,
#  folding) will add their own sections here so everything is driven
#  from one file.
# =====================================================================

[paths]
# Raw PSRFITS root; every sub-directory listed in raw_projects is scanned
raw_root      = /aphid/temp/fast_crafts/data
raw_projects  = ZD2020_1_1_2bit, ZD2021_1_1_2bit
# Directory holding the corrected beam-position files (*_pos.fits)
pos_dir       = /fred/oz002/users/vmandaog/pulsar_search/FAST/crafts_2bit_miaocc01
# Where the audit writes everything
audit_dir     = /fred/oz002/users/vmandaog/pulsar_search/FAST/test_pulsars/audit_reprocessing

[audit]
# Regex for raw file names. Must define named groups: prefix, beam, idx
# e.g. Dec+3114_06_07_arcdrift-M01_0001_2bit.fits
#      prefix = Dec+3114_06_07_arcdrift, beam = 01, idx = 0001, suffix = _2bit
file_regex    = ^(?P<prefix>.+?)-M(?P<beam>\d{2})_(?P<idx>\d{4})(?P<suffix>_[^.]+)?\.fits$
# Regex for position files. Groups: pointing, date, optional hh, mm
pos_regex     = ^(?P<pointing>.+)_(?P<date>\d{8})(?:_(?P<hh>\d{2})_(?P<mm>\d{2}))?_pos\.fits$
# Beams expected per observation
n_beams       = 19

# ---- used by audit_simple.py (file-count audit) ----
# seconds per raw fits file (19 files ~ 4 min); only used for time estimates
file_dur_s          = 12.885
# best files-per-chunk is searched over chunk lengths min_chunk_s..max_chunk_s
# (exact divisor of the file count preferred, closest to target_chunk_s);
# target_chunk_s / min_chunk_s are also used by audit_raw.py
max_chunk_s         = 480
# if no exact divisor exists, any k leaving <= this many files over counts as
# good enough, and the one closest to target_chunk_s is chosen
max_remainder_files = 3

# ---- used by audit_raw.py (full header / contiguity audit, later) ----
# Which beams to open for full header reads ("all", or e.g. "1" / "1,10,19").
# An epoch can be ~1400 files per beam (x19 beams), so reading every header on
# /aphid is slow. Default: read M01 fully (timing, gaps, header values); every
# other beam is checked for missing indices and for file size vs the epoch's
# typical size (catches truncated files cheaply). Use "all" for a full check.
header_beams  = 1
# Parallel header readers
n_workers     = 16

# Two consecutive files are contiguous if |gap| <= this (seconds)
contig_tol_s  = 0.1

# Chunking (for digifil). Target ~4 min = 19 x ~12.9 s files.
target_chunk_s     = 245
# Allowed range of files per chunk (0 = derive as 0.75x / 1.25x target)
min_files_per_chunk = 0
max_files_per_chunk = 0
# What to do with files left over after equal chunks:
#   drop       - discard them
#   own_chunk  - make a shorter final chunk if it is >= min_chunk_s, else drop
#   extend_last- add them onto the last chunk
leftover_policy = own_chunk
min_chunk_s     = 120

# =====================================================================
#  AUTOMATED PIPELINE (crafts.py)
# =====================================================================
[pipeline]
# all processing output; epoch dirs are <proc_root>/<project>/<pointing>/<date>/
proc_root              = /aphid/temp/fast_crafts/crafts_processing
# your existing scripts (called unchanged)
scripts_dir            = /aphid/temp/fast_crafts/crafts_processing/final_scripts
update_pointing_script = /aphid/temp/fast_crafts/crafts_processing/update_pointing_v2.py
env_activate           = /fred/oz002/users/vmandaog/vmandaog_env/bin/activate
python                 = python
# check your cluster limit: scontrol show config | grep -i MaxArraySize
# bigger task lists are split into several array jobs automatically
max_array_size         = 1000
# make an empty zap file for a chunk where make_zap_list wrote none
empty_zap_if_missing   = true
ssh_host               = vmandaog@nt.swin.edu.au

[science]
# passed exactly as in your current scripts
digifil_args    = -cont -f 4
birdie_min_sn   = 10
birdie_dm_start = 0
birdie_dm_end   = 5
search_min_sn   = 5
search_dm_start = 5
search_dm_end   = 500
t_window        = 25.6
t_shift         = 12.8
zap_t           = 25.6

# ---- SLURM resources per step ---------------------------------------
# Defaults live in the #SBATCH lines of steps/NN_*.sbatch (copied from your
# scripts, including the partition lines). Anything set here overrides them
# on the sbatch command line. Leave blank to keep the script's value.
# throttle = max array tasks running at once (0 = no limit)
# After a few epochs, `crafts.py resources` suggests values from real runs.
[slurm.update_pointing]
time =
mem  =

[slurm.digifil]
time =
mem  =
throttle = 0

[slurm.clean]
time =
mem  =
throttle = 0

[slurm.birdies]
time =
mem  =
throttle = 0

[slurm.zaplist]
time =

[slurm.search]
time =
mem  =
throttle = 0

[slurm.prepare_fold]
time =
mem  =

[slurm.fold]
throttle = 0

[slurm.check]
time = 00:15:00
mem  = 2G

# Fold tasks are grouped by number of candidates (rows in the --cands csv),
# each group gets its own time/mem.  name = max_candidates, time, mem
# (your test: 33 candidates -> 105 s, 425 MB)
[fold_classes]
small  = 50, 00:20:00, 2G
medium = 300, 01:30:00, 3G
large  = 100000, 06:00:00, 4G

# A task also counts as FAILED if its .out/.err contains any of these
# (|-separated). Catches errors your scripts log but do not exit on,
# e.g. run_peasoup() catches peasoup failures and carries on.
[fail_patterns]
update_pointing = Traceback
digifil         = Traceback
clean           = Traceback
birdies         = Error in peasoup processing|Traceback|CUDA error
search          = Error in peasoup processing|Traceback|CUDA error
zaplist         = Traceback
prepare_fold    = Traceback
fold            = Traceback
